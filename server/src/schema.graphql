type Query {
    "Fetch a list of tracks for the homepage grid"
    tracksForHome: [Track!]!
}

"Educational modules teaching a specific topic"
type Track {
    id: ID!
    title: String!
    author: Author!
    thumbnail: String
    length: Int
    modulesCount: Int
}

"An author of a track or module"
type Author {
    id: ID!
    name: String!
    photo: String
}
